<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#245c88"><title>貓魔獸後勤站 v0.1.1</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;background:#f2f6fa;color:#243447}main{max-width:680px;margin:auto;padding:18px 14px 55px}header{background:#245c88;color:white;padding:22px;border-radius:18px}h1{font-size:25px;margin:0 0 7px}h2{font-size:19px;margin:0 0 13px}.muted{color:#65758a;font-size:13px}.white{color:#e7f2fb}.card{background:white;border-radius:16px;padding:17px;margin-top:15px;box-shadow:0 2px 10px #1430470c}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.bin{border:1px solid #d9e3ed;border-radius:13px;padding:12px}.bin strong{font-size:16px}.bin p{font-size:12px;color:#66778a;margin:7px 0}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:12px 14px;font-weight:650;background:#245c88;color:white;min-height:43px}button.secondary{background:#e7f0f7;color:#245c88}button.small{font-size:13px;padding:8px 10px;min-height:38px}button:disabled{opacity:.45}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}select,input[type=file]{width:100%;padding:9px;border:1px solid #cbd7e2;border-radius:9px;background:white}label{font-size:14px}.status{font-weight:700;color:#245c88}.checkline{display:flex;gap:8px;align-items:center;margin:7px 0}input[type=checkbox]{width:19px;height:19px;accent-color:#245c88}.history{padding:9px 0;border-bottom:1px solid #edf0f4;font-size:13px}.warn{background:#fff5e8;border-radius:10px;padding:10px;font-size:13px;color:#72521c}.footer{font-size:12px;color:#65758a;line-height:1.6}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d425f;color:white;padding:11px 17px;border-radius:10px;display:none;max-width:90%;text-align:center}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style></head><body><main><header><h1>🐾 貓魔獸後勤站</h1><div class="white">v0.1.1｜儲存診斷版，慢慢調整</div></header><section class="card"><h2>一鍵日常紀錄</h2><div class="row"><button onclick="quick('換水')">💧 已換水</button><button onclick="quick('更換尿墊')">🧻 已換尿墊</button></div><p class="muted" id="quickStatus"></p></section><section class="card"><h2>六個貓砂盆</h2><div class="grid" id="bins"></div></section><section class="card"><h2>批次操作（少按幾次）</h2><div class="row"><button class="secondary small" onclick="selectAll(true)">六盆全選</button><button class="secondary small" onclick="selectAll(false)">清除選取</button></div><div class="grid" id="checks" style="margin:12px 0"></div><div class="row"><button onclick="batch('清砂')">所選盆：清砂完成</button><button onclick="batch('洗盆')">所選盆：洗盆完成</button></div><p class="muted">清砂會依設定將全新砂→半新砂→用過砂；用過砂仍維持用過砂。洗盆不會自動改砂況，請自行選擇新裝入的砂況。</p></section><section class="card"><h2>最近紀錄</h2><div id="history"></div></section><section class="card"><h2>儲存狀態檢查</h2><p class="muted" id="storageStatus"></p><button class="secondary" onclick="checkStorage()">檢查是否可保存</button></section><section class="card"><h2>資料備份</h2><div class="row"><button class="secondary" onclick="exportData()">⬇ 匯出備份檔</button><label style="flex:1">匯入備份檔<input type="file" id="importFile" accept="application/json,.json" onchange="importData(event)"></label></div><p class="warn">目前資料儲存在這個瀏覽器的本機儲存空間。清除網站資料、更換裝置或以不同方式開啟檔案，都可能看不到原紀錄。請定期匯出備份；匯入會覆蓋目前資料。</p></section><p class="footer">這是單機試用版，不會自動同步到其他手機，也不會發送提醒。紀錄用於協助回想，不代表貓砂的衛生安全評估。廢砂請裝袋妥善處理，不要倒入水管或排水溝。</p></main><div id="toast" role="status"></div><script>const KEY='dolphin_catcare_v01';const phases=['全新砂','半新砂','用過砂'];function blank(){return {bins:Array.from({length:6},(_,i)=>({id:i+1,phase:phases[Math.floor(i/2)],clean:null,wash:null})),water:null,pad:null,history:[]}}let state;let storageError='';try{state=JSON.parse(localStorage.getItem(KEY))||blank();if(!Array.isArray(state.bins)||state.bins.length!==6)throw Error('invalid')}catch(e){state=blank();storageError='讀取失敗：'+e.message}function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));const check=localStorage.getItem(KEY);if(check!==JSON.stringify(state))throw Error('寫入後讀取不一致');storageError=''}catch(e){storageError='寫入失敗：'+e.message;alert('無法保存到瀏覽器，請先匯出備份：'+e.message)}}function checkStorage(){try{const k=KEY+'_test',v=String(Date.now());localStorage.setItem(k,v);if(localStorage.getItem(k)!==v)throw Error('寫入後無法讀取');localStorage.removeItem(k);notice('本次儲存檢查成功');document.getElementById('storageStatus').textContent='本次檢查：可以讀寫；仍需重新整理測試'}catch(e){document.getElementById('storageStatus').textContent='儲存失敗：'+e.message}}function fmt(iso){return iso?new Date(iso).toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'尚未紀錄'}function notice(s){const t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2100)}function record(label){state.history.unshift({label,time:new Date().toISOString()});state.history=state.history.slice(0,300)}function quick(kind){const now=new Date().toISOString();if(kind==='換水')state.water=now;else state.pad=now;record(kind);persist();render();notice('已記錄：'+kind)}function doBin(i,kind){const b=state.bins[i],now=new Date().toISOString();if(kind==='清砂'){b.clean=now;b.phase=phases[Math.min(2,phases.indexOf(b.phase)+1)]}else b.wash=now;record(`${b.id} 號盆：${kind}`)}function single(i,kind){doBin(i,kind);persist();render();notice(`已記錄 ${i+1} 號盆${kind}`)}function phaseChange(i,v){state.bins[i].phase=v;record(`${i+1} 號盆：砂況設為${v}`);persist();render()}function selectAll(yes){document.querySelectorAll('.bincheck').forEach(c=>c.checked=yes)}function batch(kind){const ids=[...document.querySelectorAll('.bincheck:checked')].map(x=>Number(x.value));if(!ids.length){notice('請先選擇砂盆');return}ids.forEach(i=>doBin(i,kind));persist();render();notice(`已記錄 ${ids.length} 盆${kind}`)}function render(){document.getElementById('storageStatus').textContent=storageError||('開啟方式：'+location.protocol+' ｜已載入 '+state.history.length+' 筆紀錄（請用 F5 驗證）');document.getElementById('quickStatus').textContent=`上次換水：${fmt(state.water)}｜上次換尿墊：${fmt(state.pad)}`;document.getElementById('bins').innerHTML=state.bins.map((b,i)=>`<div class="bin"><strong>🐾 ${b.id} 號盆</strong><p>目前砂況</p><select aria-label="${b.id} 號盆砂況" onchange="phaseChange(${i},this.value)">${phases.map(p=>`<option ${p===b.phase?'selected':''}>${p}</option>`).join('')}</select><p>清砂：${fmt(b.clean)}</p><p>洗盆：${fmt(b.wash)}</p><div class="row"><button class="secondary small" onclick="single(${i},'清砂')">清砂</button><button class="secondary small" onclick="single(${i},'洗盆')">洗盆</button></div></div>`).join('');document.getElementById('checks').innerHTML=state.bins.map(b=>`<label class="checkline"><input class="bincheck" type="checkbox" value="${b.id-1}"> ${b.id} 號盆</label>`).join('');document.getElementById('history').innerHTML=state.history.length?state.history.slice(0,20).map(h=>`<div class="history">${escapeHTML(h.label)}<br><span class="muted">${fmt(h.time)}</span></div>`).join(''):'<p class="muted">尚無紀錄，試著按一個按鈕吧。</p>'}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function exportData(){const blob=new Blob([JSON.stringify({app:'catcare-v01',data:state},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='貓魔獸後勤站備份_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}async function importData(e){const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(x.app!=='catcare-v01'||!Array.isArray(x.data?.bins)||x.data.bins.length!==6||!Array.isArray(x.data.history))throw Error('備份格式不正確');if(!confirm('匯入會覆蓋目前紀錄，確定嗎？'))return;state=x.data;persist();render();notice('備份匯入成功')}catch(err){alert('匯入失敗：'+err.message)}finally{e.target.value=''}}render();</script></body></html>
